<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Stream Scout</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img class="mark" src="icon32.png" alt="" width="28" height="28">
        <div><h1>Stream Scout</h1><p id="status">Looking for media on this tab…</p></div>
        <button id="refresh" class="icon" type="button" title="Look again" aria-label="Look again"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
      </header>
      <section id="now" class="now hidden" aria-label="Now casting">
        <div class="now-heading"><strong id="now-title"></strong><span id="now-device"></span></div>
        <input id="now-seek" type="range" min="0" max="0" step="1" value="0" aria-label="Position">
        <div class="now-row">
          <span id="now-time">0:00 / 0:00</span>
          <select id="now-subtitle" aria-label="Subtitles"></select>
        </div>
        <div class="now-row now-controls">
          <button id="now-play" type="button">Pause</button><button id="now-stop" type="button">Stop</button><button id="now-disconnect" type="button">Disconnect</button>
        </div>
      </section>
      <section id="streams" aria-live="polite"></section>
      <section id="empty" class="empty hidden">
        <strong>No playable streams yet</strong>
      </section>
    </main>
    <div class="toasts">
      <div id="notice" class="toast hidden" role="alert"><span id="notice-text"></span><button type="button" class="toast-close" aria-label="Dismiss">&times;</button></div>
    </div>
    <template id="stream-template">
      <article class="stream">
        <div class="stream-main">
          <button class="player" type="button" title="Open in player" aria-label="Open in player"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"/></svg></button>
          <div class="stream-info">
            <div class="stream-label"></div>
            <div class="stream-meta"><span class="badge"></span><span class="stream-url"></span></div>
          </div>
          <button class="cast icon" type="button" title="Cast to TV" aria-label="Cast to TV"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg></button>
          <button class="download icon" type="button" title="Download" aria-label="Download"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg></button>
        </div>
        <div class="stream-options">
          <label class="quality-wrap hidden"><span>Quality</span><select class="quality"></select></label>
        </div>
      </article>
    </template>
    <script src="cast-media.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
